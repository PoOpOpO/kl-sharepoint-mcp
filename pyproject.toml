[project]
name = "mcp-sharepoint"
version = "0.1.2"
description = "MCP Server to integrate with SharePoint"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
 "mcp>=1.2.1",
 "msal>=1.31.0",
 "msal-extensions>=1.1.0",
 "python-dotenv>=1.0.0",
 "requests>=2.32.0",
]

[[project.authors]]
name = "sofias tech"

[project.optional-dependencies]
vision = [
 "torch>=2.1",
 "torchvision>=0.16",
 "numpy>=1.24",
 "Pillow>=10.0",
 "gradio>=4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mcp-sharepoint = "mcp_sharepoint:main"
patchcore-vision = "patchcore_vision.cli:main"